[project]
name = "mini-notebooklm-backend"
version = "0.1.0"
description = "Mini-NotebookLM backend service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "aiosqlite>=0.20.0",
    "qdrant-client>=1.12.0",
    "httpx>=0.28.0",
    "openai>=1.60.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: flake8-bugbear
select = ["E", "W", "F", "I", "UP", "B"]
# E501 (line length) is enforced by the formatter, not the linter
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test scripts may keep unused imports / star-style scaffolding
"test_*.py" = ["F401", "B"]
